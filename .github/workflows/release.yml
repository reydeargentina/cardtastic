name: Publish firmware release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Run native regression tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -Isrc test/native/client_state_test.cpp -o /tmp/cardtastic-client-state-test
          /tmp/cardtastic-client-state-test
      - name: Build and package firmware
        run: python scripts/package_release.py --tag "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            The merged Cardtastic firmware image is flashed at offset `0x0`.
            Verify it with `sha256sum -c SHA256SUMS.txt`.
            See [the release guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASING.md) for details.
          files: |
            dist/cardtastic-${{ github.ref_name }}-m5stack-cardputer.bin
            dist/SHA256SUMS.txt
