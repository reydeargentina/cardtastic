[platformio]
extra_configs = platformio.local.ini

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200

upload_flags =
  --before=default_reset
  --after=hard_reset
  --no-stub

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git#e0232804763d3e42d7e9be90e43cf6e1c9e7565b
    h2zero/NimBLE-Arduino@2.3.7
    M5Unified@0.2.29
    M5GFX@0.2.36
    z3t0/IRremote@4.7.1
    nanopb/Nanopb@0.4.91
    bblanchon/ArduinoJson@6.21.5
