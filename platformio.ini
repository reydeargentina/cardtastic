[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:C8:8D:D4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:C8:8D:D4-if00
upload_speed = 115200
monitor_speed = 115200

upload_flags =
  --before=default_reset
  --after=hard_reset
  --no-stub

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    h2zero/NimBLE-Arduino
    nanopb/Nanopb@0.4.91
